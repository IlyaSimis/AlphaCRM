# Полный стек: PostgreSQL + Spring backend + nginx с интерфейсом.
# Запуск: ./scripts/start.sh (WSL/Linux) или .\scripts\start.ps1 (PowerShell).
# Только база для локальной разработки: docker compose up -d postgres
name: quiet-clinic

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quiet_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-quiet_clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (scripts/init-env.sh)}
    ports:
      # Только localhost: для IDE и миграций. Снаружи база недоступна.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - quiet-clinic-postgres:/var/lib/postgresql

  backend:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: quiet-clinic-api:${APP_VERSION:-local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quiet_clinic}
      DATABASE_USER: ${POSTGRES_USER:-quiet_clinic}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      CLINIC_DEV_KMS_KEY: ${CLINIC_KMS_KEY:?Задайте CLINIC_KMS_KEY в .env (scripts/init-env.sh)}
      # Пустая база: клиника и её администратор admin. Пароль обязателен (scripts/init-env.sh).
      CLINIC_NAME: ${CLINIC_NAME:-AlphaCRM}
      CLINIC_ADMIN_NAME: ${CLINIC_ADMIN_NAME:-Администратор}
      CLINIC_ADMIN_PASSWORD: ${CLINIC_ADMIN_PASSWORD:?Задайте CLINIC_ADMIN_PASSWORD в .env (scripts/init-env.sh)}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Внешние выводы: секреты только из .env. Пусто — канал выключен, сообщения ждут в outbox.
      CLINIC_OUTBOUND_WEBHOOK_URL: ${CLINIC_OUTBOUND_WEBHOOK_URL:-}
      CLINIC_OUTBOUND_WEBHOOK_SECRET: ${CLINIC_OUTBOUND_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLINIC_CASHBOX_URL: ${CLINIC_CASHBOX_URL:-}
      CLINIC_CASHBOX_SECRET: ${CLINIC_CASHBOX_SECRET:-}
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-UTC}
      # API Telegram-бота (/api/v1/bot/**). Пусто — API выключено. Снаружи nginx этот путь не отдаёт.
      CLINIC_BOT_API_TOKEN: ${CLINIC_BOT_API_TOKEN:-}
      CLINIC_BOT_CLINIC_ID: ${CLINIC_BOT_CLINIC_ID:-}
      CLINIC_BOT_SERVICE: ${CLINIC_BOT_SERVICE:-Первичный приём}
      CLINIC_BOT_TASK_ASSIGNEE: ${CLINIC_BOT_TASK_ASSIGNEE:-}
      TELEGRAM_REMINDER_BUTTONS: ${TELEGRAM_REMINDER_BUTTONS:-true}
      # Честный знак: none — не настроено (операции ждут в очереди), mock — заглушка MVP.
      CLINIC_MARKING_ADAPTER: ${CLINIC_MARKING_ADAPTER:-none}
      # Корпоративный диск: зашифрованные файлы в томе quiet-clinic-drive.
      CLINIC_DRIVE_STORAGE_DIR: /var/lib/alphacrm/drive
      CLINIC_DRIVE_QUOTA_BYTES: ${CLINIC_DRIVE_QUOTA_BYTES:-10737418240}
      # ИИ-навигатор. Пустой ключ — локальный поиск работает, обращения к модели выключены.
      CLINIC_ASSISTANT_API_KEY: ${CLINIC_ASSISTANT_API_KEY:-}
      CLINIC_ASSISTANT_MODEL: ${CLINIC_ASSISTANT_MODEL:-gpt-5.4-nano}
      CLINIC_ASSISTANT_API_URL: ${CLINIC_ASSISTANT_API_URL:-https://api.openai.com/v1}
    volumes:
      - quiet-clinic-drive:/var/lib/alphacrm/drive
    depends_on:
      postgres:
        condition: service_healthy
    # Порт не публикуется: backend доступен только через nginx.
    expose:
      - "8081"
    deploy:
      resources:
        limits:
          memory: 768m

  frontend:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    image: quiet-clinic-web:${APP_VERSION:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"

  # Telegram-бот клиники (проект ClinicaBot). Включается профилем: COMPOSE_PROFILES=bot в .env.
  # Ходит в backend напрямую по внутренней сети, наружу портов не открывает.
  bot:
    <<: *restart
    profiles: ["bot"]
    build:
      context: ${BOT_SOURCE_DIR:-../ClinicaBot}
    image: quiet-clinic-bot:${APP_VERSION:-local}
    environment:
      # Тот же бот, через который CRM шлёт пациентам подтверждения и напоминания.
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLINIC_API_URL: http://backend:8081/api/v1/bot
      CLINIC_API_TOKEN: ${CLINIC_BOT_API_TOKEN:-}
      OPERATOR_CHAT_ID: ${BOT_OPERATOR_CHAT_ID:-}
      ADMIN_IDS: ${BOT_ADMIN_IDS:-}
      CLINIC_ADDRESS: ${CLINIC_ADDRESS:-}
      CLINIC_PHONE: ${CLINIC_PHONE:-}
      CLINIC_HOURS: ${CLINIC_HOURS:-}
      CLINIC_PRIVACY_URL: ${CLINIC_PRIVACY_URL:-}
      BOT_CONSENT_VERSION: ${BOT_CONSENT_VERSION:-telegram-bot-v1}
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  quiet-clinic-postgres:
  quiet-clinic-drive:
