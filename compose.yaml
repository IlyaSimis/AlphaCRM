services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: quiet_clinic
      POSTGRES_USER: quiet_clinic
      POSTGRES_PASSWORD: quiet_clinic
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiet_clinic -d quiet_clinic"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - quiet-clinic-postgres:/var/lib/postgresql

volumes:
  quiet-clinic-postgres:
