# За внешним HTTPS-прокси (Caddy, Traefik) nginx получает обычный HTTP. Схему берём из
# X-Forwarded-Proto прокси, иначе backend посчитает https-Origin браузера чужим и ответит 403.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

upstream quiet_clinic_api {
  server backend:8081;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Приватные API ботов: только backend:8081 внутри Docker-сети или WireGuard. Снаружи их нет.
  location ^~ /api/v1/bot/ {
    return 404;
  }
  location ^~ /api/v1/messenger/ {
    return 404;
  }

  # WebSocket внутреннего чата сотрудников: та же сессия и тот же контур безопасности, что у REST.
  location = /api/v1/staff-chat/events {
    proxy_pass http://quiet_clinic_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /api/ {
    # Файл корпоративного диска до 100 МБ плюс поля формы (PDF пациента сервис ограничивает 10 МБ).
    client_max_body_size 101m;
    proxy_pass http://quiet_clinic_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host — вместе с портом, как его видит браузер. С $host порт терялся, backend считал
    # POST с Origin http://localhost:8080 запросом с чужого адреса и отвечал 403 (CORS).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # Защитные заголовки и кэш задаёт nginx; одноимённые от Spring скрываем, иначе в ответе
    # оказывается «DENY, DENY» и «nosniff, nosniff». HSTS приходит от Spring один раз.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # PDF для печати открывается в новой вкладке встроенным просмотрщиком браузера. Общая CSP
  # (object-src 'none') мешает просмотрщику, поэтому здесь своя, узкая: только этот файл,
  # без скриптов и без встраивания на чужие сайты. Права и сессия — те же, что у /api/.
  location ~ ^/api/v1/patient-files/[0-9a-fA-F-]+/inline$ {
    proxy_pass http://quiet_clinic_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Expires;
    proxy_hide_header Content-Security-Policy;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; object-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'self'" always;
  }

  # Файлы сборки Vite содержат хеш в имени — их можно кэшировать надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
