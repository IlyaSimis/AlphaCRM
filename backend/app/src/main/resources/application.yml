server:
  port: ${PORT:8081}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: quiet-clinic-api
  servlet:
    multipart:
      # Диск (drive) принимает файлы до clinic.drive.max-file-bytes (100 МБ); предел PDF пациента
      # проверяет сервис. Запрос чуть больше файла: граница multipart и поля формы.
      max-file-size: 100MB
      max-request-size: 101MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/quiet_clinic}
    username: ${DATABASE_USER:quiet_clinic}
    password: ${DATABASE_PASSWORD:quiet_clinic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs

clinic:
  dev-kms-key: ${CLINIC_DEV_KMS_KEY:local-dev-key-change-me}
  # Пустая база: клиника и её администратор admin (см. ClinicBootstrap). Пароля в коде нет.
  name: ${CLINIC_NAME:AlphaCRM}
  # ФИО начального администратора — данные, поэтому по-русски и в конфигурации, а не в коде.
  admin-full-name: ${CLINIC_ADMIN_NAME:Администратор}
  admin-password: ${CLINIC_ADMIN_PASSWORD:}
  # Начальный администратор меняет пароль до остальных страниц (в профиле local — нет).
  admin-must-change-password: true
  cors:
    # Явные origin фронтенда для локальной разработки; cookie сессии разрешены, «*» — нет.
    allowed-origins: ${CLINIC_CORS_ORIGINS:http://localhost:43127,http://127.0.0.1:43127}
  # Часовой пояс дат и времени в сообщениях пациенту. Расписание хранится в UTC и так же
  # показывается на экране, поэтому по умолчанию — UTC.
  time-zone: ${CLINIC_TIME_ZONE:UTC}
  outbox:
    # Доставщик outbox: забирает PENDING и повторяет неудачные попытки с паузой.
    enabled: ${CLINIC_OUTBOX_ENABLED:true}
    poll-interval: ${CLINIC_OUTBOX_POLL_INTERVAL:PT30S}
  outbound:
    # Секреты — только из окружения. Пусто — канал не настроен, сообщения остаются PENDING.
    webhook-url: ${CLINIC_OUTBOUND_WEBHOOK_URL:}
    webhook-secret: ${CLINIC_OUTBOUND_WEBHOOK_SECRET:}
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
    # Под напоминанием в Telegram — кнопки «Подтвердить» и «Отменить запись»; их обрабатывает бот клиники.
    telegram-reminder-buttons: ${TELEGRAM_REMINDER_BUTTONS:true}
  cashbox:
    # Онлайн-касса для чеков. Пусто — чек остаётся QUEUED.
    url: ${CLINIC_CASHBOX_URL:}
    secret: ${CLINIC_CASHBOX_SECRET:}
  bot:
    # API Telegram-бота (/api/v1/bot/**): сервисный токен в заголовке X-Bot-Token. Пусто — API выключено.
    api-token: ${CLINIC_BOT_API_TOKEN:}
    # Клиника бота. Пусто — единственная клиника в базе; при нескольких клиниках задайте id.
    clinic-id: ${CLINIC_BOT_CLINIC_ID:}
    # Логин сотрудника, которому уходят обращения «связаться с оператором». Пусто — первый активный администратор.
    task-assignee: ${CLINIC_BOT_TASK_ASSIGNEE:}
  online-booking:
    # Услуга из справочника, на которую пациент записывается в боте: её длительность задаёт окно.
    service-name: ${CLINIC_BOT_SERVICE:Первичный приём}
    # Шаг начала окон от начала смены, горизонт в днях и минимальный запас до приёма.
    slot-step: ${CLINIC_BOT_SLOT_STEP:PT30M}
    days: ${CLINIC_BOT_BOOKING_DAYS:14}
    min-lead: ${CLINIC_BOT_MIN_LEAD:PT2H}
    max-slots: ${CLINIC_BOT_MAX_SLOTS:60}
  events:
    # Релей доменных событий (outbox → потребители → inbox): после фиксации транзакции событие
    # раздаётся сразу; фоновый проход повторяет то, что не раздалось.
    enabled: ${CLINIC_EVENTS_ENABLED:true}
    poll-interval: ${CLINIC_EVENTS_POLL_INTERVAL:PT30S}
  registry:
    # Задача регистратуры о нехватке на складе: название позиции и недостающее количество.
    stock-shortage-title: "${CLINIC_STOCK_SHORTAGE_TITLE:Нехватка на складе — %s (не хватает %s)}"
  inventory:
    # Название основного склада, который создаётся сам при первом обращении к складу.
    default-warehouse-name: ${CLINIC_DEFAULT_WAREHOUSE:Основной склад}
    # Основные категории видов: в них попадают позиции, заведённые без категории (быстрый приход,
    # загрузка из файла). Единица — для строк без единицы.
    default-category:
      drug: Лекарства
      medical-device: Медизделия
      consumable: Расходники
      goods: Товары
    default-unit: шт
  marking:
    # Адаптер Честного знака: none — не настроено (операции ждут с MARKING_NOT_CONFIGURED),
    # mock — заглушка MVP, отвечает «принято» и ничего не отправляет.
    adapter: ${CLINIC_MARKING_ADAPTER:none}
    relay-enabled: ${CLINIC_MARKING_RELAY_ENABLED:true}
    poll-interval: ${CLINIC_MARKING_POLL_INTERVAL:PT60S}
  drive:
    # Корпоративный диск: файлы шифруются в сервисе и лежат в каталоге хранилища (Docker-том).
    storage-dir: ${CLINIC_DRIVE_STORAGE_DIR:./data/drive}
    max-file-bytes: ${CLINIC_DRIVE_MAX_FILE_BYTES:104857600}
    default-quota-bytes: ${CLINIC_DRIVE_QUOTA_BYTES:10737418240}
    keep-versions: ${CLINIC_DRIVE_KEEP_VERSIONS:20}
    trash-days: ${CLINIC_DRIVE_TRASH_DAYS:30}
    max-link-days: ${CLINIC_DRIVE_MAX_LINK_DAYS:30}
  assistant:
    # OpenAI-compatible API. Ключ только на backend; пусто — доступен локальный поиск без модели.
    api-key: ${CLINIC_ASSISTANT_API_KEY:}
    model: ${CLINIC_ASSISTANT_MODEL:gpt-5.4-nano}
    api-url: ${CLINIC_ASSISTANT_API_URL:https://api.openai.com/v1}
