server:
  port: ${PORT:8081}

spring:
  application:
    name: quiet-clinic-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/quiet_clinic}
    username: ${DATABASE_USER:quiet_clinic}
    password: ${DATABASE_PASSWORD:quiet_clinic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs

clinic:
  dev-kms-key: ${CLINIC_DEV_KMS_KEY:local-dev-key-change-me}
