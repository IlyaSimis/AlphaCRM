server:
  port: ${PORT:8081}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: quiet-clinic-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/quiet_clinic}
    username: ${DATABASE_USER:quiet_clinic}
    password: ${DATABASE_PASSWORD:quiet_clinic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs

clinic:
  dev-kms-key: ${CLINIC_DEV_KMS_KEY:local-dev-key-change-me}
  # Пустая база: клиника и её администратор admin (см. ClinicBootstrap). Пароля в коде нет.
  name: ${CLINIC_NAME:AlphaCRM}
  # ФИО начального администратора — данные, поэтому по-русски и в конфигурации, а не в коде.
  admin-full-name: ${CLINIC_ADMIN_NAME:Администратор}
  admin-password: ${CLINIC_ADMIN_PASSWORD:}
  # Начальный администратор меняет пароль до остальных страниц (в профиле local — нет).
  admin-must-change-password: true
  cors:
    # Явные origin фронтенда для локальной разработки; cookie сессии разрешены, «*» — нет.
    allowed-origins: ${CLINIC_CORS_ORIGINS:http://localhost:43127,http://127.0.0.1:43127}
  # Часовой пояс дат и времени в сообщениях пациенту. Расписание хранится в UTC и так же
  # показывается на экране, поэтому по умолчанию — UTC.
  time-zone: ${CLINIC_TIME_ZONE:UTC}
  outbox:
    # Доставщик outbox: забирает PENDING и повторяет неудачные попытки с паузой.
    enabled: ${CLINIC_OUTBOX_ENABLED:true}
    poll-interval: ${CLINIC_OUTBOX_POLL_INTERVAL:PT30S}
  outbound:
    # Секреты — только из окружения. Пусто — канал не настроен, сообщения остаются PENDING.
    webhook-url: ${CLINIC_OUTBOUND_WEBHOOK_URL:}
    webhook-secret: ${CLINIC_OUTBOUND_WEBHOOK_SECRET:}
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
  cashbox:
    # Онлайн-касса для чеков. Пусто — чек остаётся QUEUED.
    url: ${CLINIC_CASHBOX_URL:}
    secret: ${CLINIC_CASHBOX_SECRET:}
