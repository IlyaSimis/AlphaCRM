# Тексты сообщений пациенту. Только нейтральный шаблон: клиника, услуга, врач, дата и время.
# Ни диагноза, ни жалоб, ни текста приёма здесь быть не должно. Файл в UTF-8.
appointment-confirmed=Вы записаны в {clinic}: {service}, врач {practitioner}, {date} в {time}.
appointment-reminder=Напоминаем о записи в {clinic}: {service}, врач {practitioner}, {date} в {time}.
appointment-reminder-3h=Напоминаем о записи в {clinic}: {service}, врач {practitioner}, {date} в {time}.
appointment-cancelled=Запись в {clinic} на {date} в {time} отменена ({service}, врач {practitioner}).
# Кнопки под напоминанием в Telegram (TELEGRAM_REMINDER_BUTTONS=true). Нажатие обрабатывает бот клиники:
# callback_data «cf:<id записи>:yes» или «cf:<id записи>:no», бот вызывает /api/v1/bot/appointments/<id>/confirm|cancel.
telegram-button-confirm=Подтвердить
telegram-button-decline=Отменить запись
