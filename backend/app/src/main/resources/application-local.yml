spring:
  session:
    # В локальных тестах — обычная MockHttpSession; правило одной активной сессии общее с prod.
    store-type: none
  datasource:
    url: jdbc:h2:mem:quietclinic;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  structured:
    format:
      console:

clinic:
  # Только для локальной разработки: вход admin / admin сразу, без смены пароля.
  admin-password: admin
  admin-must-change-password: false
  # Локально маркировка отвечает заглушкой, файлы диска — во временном каталоге.
  marking:
    adapter: mock
  drive:
    storage-dir: ${java.io.tmpdir}/alphacrm-drive
