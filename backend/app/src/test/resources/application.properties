# Тесты запускают доставщик outbox вручную (OutboxDispatcherTest); фоновый запуск по расписанию
# мешал бы проверкам. Остальные настройки — из application.yml и application-local.yml.
clinic.outbox.enabled=false
# «Сейчас» для правила «не записывать в прошлое»: тестовые записи датированы октябрём–декабрём
# 2026 года и не должны устаревать вместе с календарём.
clinic.fixed-time=2026-10-19T00:00:00Z
# Тесты много раз ошибаются паролем с одного адреса (127.0.0.1); лимит на адрес здесь не проверяется.
clinic.login.max-failures-per-address=1000
