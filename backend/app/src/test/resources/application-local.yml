spring:
  datasource:
    # Каждый тестовый ApplicationContext получает свою H2: кэшированные контексты с разными
    # настройками больше не применяют Liquibase и не меняют данные в общей базе друг друга.
    url: jdbc:h2:mem:quietclinic-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  structured:
    format:
      console:

clinic:
  admin-password: admin
  admin-must-change-password: false
  marking:
    adapter: mock
  drive:
    storage-dir: ${java.io.tmpdir}/alphacrm-drive
